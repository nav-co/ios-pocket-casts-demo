name: Build
on:
  #push:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on:
      group: Bitrise-M4Pro

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Runs a set of commands using the runners shell
      - name: Setup Signal iOS
        run: |
          git clone --depth=1 --recurse-submodules https://github.com/benbitrise/pocket-casts-ios
          cd pocket-casts-ios
          make install_dependencies
          make external_contributor
      - name: Build app
        run: |
          cd pocket-casts-ios
          set -o pipefail && xcodebuild "archive" "-project" "podcasts.xcodeproj" "-scheme" "Pocket Casts Prototype Build" "-destination" "generic/platform=iOS Simulator" | xcpretty
